<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Student</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-gray { background: #9E9E9E; color: white; }
        .nav { margin-bottom: 20px; }
        .btn-blue { background: #2196F3; color: white; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/students" class="btn btn-green">Students</a>
    <a href="/courses" class="btn btn-blue">Courses</a>
</div>

<h1>Add New Student</h1>

<div class="form-container">
    <form action="/students/add" method="post" th:object="${student}">
        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter name" required/>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Enter email" required/>
        </div>
        <div class="form-group">
            <label>Major</label>
            <input type="text" th:field="*{major}" placeholder="Enter major"/>
        </div>
        <div class="form-group">
            <label>Course</label>
            <select th:field="*{course}">
                <option value="">-- Select Course --</option>
                <option th:each="course : ${courses}"
                        th:value="${course.id}"
                        th:text="${course.title}">
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-green">Add Student</button>
        <a href="/students" class="btn btn-gray">Cancel</a>
    </form>
</div>
</body>
</html>
