<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Course</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-blue { background: #2196F3; color: white; }
        .btn-gray { background: #9E9E9E; color: white; }
        .nav { margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/students" class="btn btn-green">Students</a>
    <a href="/courses" class="btn btn-blue">Courses</a>
</div>

<h1>Add New Course</h1>

<div class="form-container">
    <form action="/courses/add" method="post" th:object="${course}">
        <div class="form-group">
            <label>Title</label>
            <input type="text" th:field="*{title}" placeholder="Enter course title" required/>
        </div>
        <div class="form-group">
            <label>Instructor</label>
            <input type="text" th:field="*{instructor}" placeholder="Enter instructor name"/>
        </div>
        <div class="form-group">
            <label>Credits</label>
            <input type="number" th:field="*{credits}" placeholder="Enter credits" min="1" max="6"/>
        </div>
        <button type="submit" class="btn btn-blue">Add Course</button>
        <a href="/courses" class="btn btn-gray">Cancel</a>
    </form>
</div>
</body>
</html>
